<div class="resolicion">
    <div class="container" style="padding-left: calc(var(--bs-gutter-x) * 2.5);">
      <nav class="mt-3 navbar navbar-expand-lg colorprimary center">
        <div class="container-fluid center">
          <a class="navbar-brand center" *ngIf="ecod ===  '' "><h1 class="texttitulo">Nuevo producto</h1></a>
          <a class="navbar-brand center" *ngIf="ecod !=  '' "><h1 class="texttitulo">Editar producto</h1></a>
        </div> 
      </nav>
      <div class="row" style="justify-content:end">
        <div class="mt-3 mb-2 col-md-12 col-lg-4 col-xl-2" >
            <button matTooltip="Regresar a la consulta" style="min-width:100%; min-height: 80%; text-align-last:center; color:white; padding-left:10px" type="button" class="btn btn-warning text-white" (click)="reConsulta()" >Consulta</button> 
        </div>
        
        <div class="mt-3 mb-2 col-md-12 col-lg-4 col-xl-2" [matTooltip]="validadContras == false?'Ingrese contradeña para habilitad':'Guardar datos'">
            <button  style="min-width:100%; min-height: 80%; text-align-last:center; color:white; padding-left:10px"  [disabled]="validadContras == false " type="button" class="btn btn-warning text-white" (click)="Guardar()">Guardar</button> 
        </div>
            <div class="card">
                <div class="card-body row ">
                <ngx-spinner class="posiz" bdColor = "rgba(0, 0, 0, 0.8)" size = "large" color = "#c98989" type = "ball-8bits" [fullScreen] = "false"><p  class="  col-12" > </p> <br><h1 style="color: white">Loading... </h1></ngx-spinner>
                        <form class="container row" [formGroup]="NuevoFormGroup"(ngSubmit)="Guardar()">
            
                            <div class="mb-3 col-md-12 col-lg-6 col-xl-4">
                                <mat-form-field appearance="outline" class="movilc">
                                    <mat-label>Nombre</mat-label>
                                    <input id="tNombre" formControlName="tNombre"  matInput required>
                                 </mat-form-field>
                            </div>
                            <div class="mb-3 col-md-12 col-lg-6 col-xl-4">
                                <mat-form-field class="example-full-width" appearance="outline">
                                    <mat-label>Marca</mat-label>
                                    <input matInput aria-label="Marca" [matAutocomplete]="autoMarca" id="ecodctlMarca" [formControl]="ecodctlMarca" placeholder="Auto Marca"  (ngModelChange)="_filterStatesMarca($event)" nullValue required>
                                    <mat-autocomplete #autoMarca="matAutocomplete"  [displayWith]="displayMarca" >
                                        <mat-option value="" style="color: black;">Seleccionar...</mat-option>
                                        <mat-option *ngFor="let state of filteredMarca | async" [value]="state">
                                        <span>{{state.tNombre}}</span>
                                      </mat-option>
                                    </mat-autocomplete>
                                  </mat-form-field>    
                            </div> 
                            <div class="mb-3 col-md-12 col-lg-6 col-xl-4">
                                <mat-form-field appearance="outline" class="movilc">
                                    <mat-label>precio</mat-label>
                                    <input type="number" maxlength="3" id="nPrecio"  formControlName="nPrecio" matInput required>
                                </mat-form-field>
                            </div> 
                            <div class="mb-3 col-md-12 col-lg-6 col-xl-4" *ngIf="ecod !=  ''">
                                <app-select-estatus [estatusPadre]="NuevoFormGroup.get('ecodEstatus')?.value" (estatusSeleccionado)="onEstatus($event)"></app-select-estatus>
                              </div>
                        </form>
                   
                </div>
            </div>

        </div>
    </div>
</div>
