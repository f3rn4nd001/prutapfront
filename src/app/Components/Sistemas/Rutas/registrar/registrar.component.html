<div class="resolicion">
    <div class="container" style="padding-left: calc(var(--bs-gutter-x) * 2.5);">
        <nav class="mt-3 navbar navbar-expand-lg colorprimary center">
            <div class="container-fluid center"><a class="navbar-brand center"><h1 class="texttitulo">Rutas</h1></a></div> 
        </nav>
        <div class="row" style="justify-content:end">
            <div class="mt-3 mb-2 col-md-12 col-lg-4 col-xl-2" >
              <button matTooltip="Regresar a la consulta" style="min-width:100%; min-height: 80%; text-align-last:center; color:white; padding-left:10px" type="button" class="btn btn-warning text-white" (click)="reConsulta()">Consulta</button> 
            </div>
            
            <div class="mt-3 mb-2 col-md-12 col-lg-4 col-xl-2" matTooltip="guardar datos">
                <button style="min-width:100%; min-height: 80%; text-align-last:center; color:white; padding-left:10px" type="button" class="btn btn-warning text-white" (click)="Guardar()">Guardar</button> 
            </div>
            <div class="card">
                <div class="card-body row ">
                    <h3>Datos Genelares {{Generar.value.formArray.length}}</h3>
                    <hr>
                    <div style="overflow-y: auto; min-height: 350px;max-height: 400px;">
                        <form class="container" [formGroup]="Generar" (ngSubmit)="Guardar()">
                            <table matSort mat-table class="table">
                            <thead>
                                <tr style="text-align: center;">
                                    <th>Op</th>
                                    <th>Menu</th>
                                    <th>Op Sub menu</th>
                                </tr>
                            </thead>
                            <tbody formArrayName="formArray">
                                <div *ngIf="Generar.value.formArray.length == 0">   <button  class="btn center colorprimary col-5" style="color:white; background:#ffc107" mat-raised-button color="#ffc107" type="button" (click)="anadirArrformArray()">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-shield-plus" viewBox="0 0 16 16">
                                      <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                      <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                                    </svg>
                                  </button></div>
                                <tr [formGroupName]="i" *ngFor="let direccion of Generar.controls['formArray'].controls; let i = index let ultimoMenu = last;">
                                    <td>
                                        <div class="row">
                                            <button *ngIf="ultimoMenu" class="btn center colorprimary col-5" style="color:white; background:#ffc107" mat-raised-button color="#ffc107" type="button" (click)="anadirArrformArray()">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-shield-plus" viewBox="0 0 16 16">
                                                  <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                  <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                                                </svg>
                                              </button>
                                            <button class="btn mt-2 mb-2 col-5" mat-raised-button color="warn" type="button" (click)="eliminarArrformArray(i)">
                                                <svg xmlns="http://www.w3.org/2000/svg" color="whith" width="25" height="25" fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                                                  <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                  <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                    <td>                               
                                        <div style="align-items: center; text-align: center;">{{i}}</div>       
                                        <mat-form-field class="example-full-width" appearance="outline">
                                            <mat-label>Menu</mat-label>
                                            <input matInput aria-label="Menu" (ngModelChange)="filtrarMenu($event,i)" [matAutocomplete]="autoMenu" id="ecodMenu" [formControl]="direccion.get('ecodMenu')" placeholder="Menu" nullValue>
                                            <mat-autocomplete #autoMenu="matAutocomplete" [displayWith]="displayStatesMenu">
                                                <mat-option *ngFor="let state of filteredStatesMenu | async" [value]="state"><span>{{state.tNombre}}</span></mat-option>
                                            </mat-autocomplete>
                                        </mat-form-field>
                                    </td>
                                    <td> 
                                        <button class="btn center colorprimary col-md-10 col-lg-5 col-xl-5"  (click)="mostrarSubmenu(i)">
                                            <mat-icon>visibility</mat-icon>
                                        </button>
                                        <button *ngIf="direccion.value.mostrarSubmenu" class="btn center colorprimary col-md-10 col-lg-5 col-xl-5" style="color:white; background:#ffc107" mat-raised-button color="#ffc107" type="button" (click)="addSubmenuArr(i)">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-shield-plus" viewBox="0 0 16 16">
                                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                                            </svg>
                                        </button>
                                    </td>
                                    <td>
                                        <div *ngIf="direccion.value.mostrarSubmenu">
                                            <table matSort mat-table class="table">
                                                <thead>
                                                    <tr style="text-align: center;">
                                                        <th>Sub menu</th>
                                                        <th></th>
                                                      <th>Op Controlador</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr [formGroupName]="j" *ngFor="let Submenu of direccion.controls['Submenu'].controls; let j = index">
                                                        <td> 
                                                            <div style="align-items: center; text-align: center;">{{i}} {{j}}</div>       
                                                            <mat-form-field class="example-full-width" appearance="outline">
                                                                <mat-label>Submenu</mat-label>
                                                                <input matInput aria-label="Submenu" (ngModelChange)="filtrarSubMenu($event,i)" [matAutocomplete]="autoSubmenu"  id="ecodSubmenu" [formControl]="Submenu.get('ecodSubmenu')"  placeholder="Submenu" nullValue>
                                                                <mat-autocomplete #autoSubmenu="matAutocomplete" [displayWith]="displayStatesSubMenu">
                                                                    <mat-option *ngFor="let state of filteredStatesSubMenu | async" [value]="state"><span>{{state.tNombre}} || {{state.tUrl}} <hr> </span></mat-option>
                                                                </mat-autocomplete>
                                                            </mat-form-field>                                                     
                                                        </td>
                                                        <td>
                                                            <button *ngIf="direccion.value.mostrarSubmenu"  class="btn mt-2 mb-2 col-5" mat-raised-button color="warn" type="button" (click)="eliminarArrSubmenu(i,j)">
                                                                <svg xmlns="http://www.w3.org/2000/svg" color="whith" width="25" height="25" fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                                                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                                                </svg>
                                                            </button>
                                                        </td>
                                                        <td>
                                                            <button class="btn center colorprimary col-md-10 col-lg-5 col-xl-5"  (click)="mostrarControlador(i,j)">
                                                                <mat-icon>visibility</mat-icon>
                                                            </button>
                                                            <button *ngIf="Submenu.value.mostrarControlador" class="btn center colorprimary col-md-10 col-lg-5 col-xl-5" style="color:white; background:#ffc107" mat-raised-button color="#ffc107" type="button" (click)="addControladorArr(i,j)">
                                                                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-shield-plus" viewBox="0 0 16 16">
                                                                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                                    <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                                                                </svg>
                                                            </button>
                                                        </td>
                                                        <td>
                                                            <div *ngIf="Submenu.value.mostrarControlador">
                                                                <table matSort mat-table class="table ">
                                                                    <thead>
                                                                        <tr style="text-align: center;">
                                                                            <th>Controlador</th>
                                                                            <th></th>
                                                                        </tr>
                                                                    </thead>
                                                                    <tbody>
                                                                        <tr [formGroupName]="x" *ngFor="let controlador of Submenu.controls['Controlador'].controls; let x = index">
                                                                            <td>
                                                                                <div style="align-items: center; text-align: center;">{{i}} {{j}} {{x}}</div>       
                                                                                <mat-form-field class="example-full-width" appearance="outline">
                                                                                    <mat-label>Controlador</mat-label>
                                                                                    <input matInput aria-label="Controller" (ngModelChange)="filtrarControllers($event,i)" [matAutocomplete]="autoControllers" id="ecodControlles" [formControl]="controlador.get('ecodController')"  placeholder="Controlador" nullValue>
                                                                                    <mat-autocomplete #autoControllers="matAutocomplete" [displayWith]="displayStatesControllers">
                                                                                        <mat-option *ngFor="let state of filteredStatesControllers | async" [value]="state">
                                                                                            <span>{{state.tNombre}} || {{state.tUrl}} </span>
                                                                                            <hr>
                                                                                        </mat-option>
                                                                                    </mat-autocomplete>
                                                                                </mat-form-field>     
                                                                            </td>
                                                                            <td>
                                                                                <button *ngIf="Submenu.value.mostrarControlador"  class="btn mt-2 mb-2 col-5" mat-raised-button color="warn" type="button" (click)="eliminarArrControlador(i,j,x)">
                                                                                    <svg xmlns="http://www.w3.org/2000/svg" color="whith" width="25" height="25" fill="currentColor" class="bi bi-dash-circle" viewBox="0 0 16 16">
                                                                                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                                                                                        <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                                                                    </svg>
                                                                                </button>
                                                                            </td>
                                                                        </tr>
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>    
                    </form>                            
                </div>
            </div>
        </div>
    </div>
</div>
