<div class="container">
    <div class="modal" tabindex="-1">
        <div class="modal-dialog modal-xl" style=" padding-left: calc(var(--bs-gutter-x) * 2);">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="col-sm-11 col-md-11 col-lg-11 col-xl-11 mt-3 center texttitulo" id="staticBackdropLabel">{{title}}</h1>
                    <button type="button" [mat-dialog-close]="" class="btn-close close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form [formGroup]="FormLogin"class="center" (ngSubmit)="Login()">
                        <div class="mb-1 col-12 ">
                            <mat-form-field appearance="outline" class="movilc">
                                <mat-label for="email">Email</mat-label>
                                <input  formControlName="email"  id="email" matInput required>
                                <mat-error>El email es requerido</mat-error>
                              </mat-form-field>
                         </div>
                         <div class="col-12 mb-4">
                            <button [disabled]="FormLogin.invalid" type="submit" mat-fab extended color="primary" style=" min-width: 80%">Enviar</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>
