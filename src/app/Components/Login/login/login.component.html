<div class="resolicion" >
    <div class="container"> 
        <div class="container w-75 colorprimary" style="min-height:525px;margin-top:5rem!important ">
            <div class="row">
                <div class="col d-none d-lg-block col-md-5 col-lg-5 col-xl-6 rounded center">
                   <br>
                    <h1 class="mt-5" style="color:#343a40; font-size: 30px;">
                       <b>dnCarlos</b> 
                       <br>"Siempre a tus servicios"
                    </h1>
                    <h2 class="text-white container">
                        Somos un Operador Logístico creado por empresas especialistas en Comercio Exterior e Internacional, con objetivos específicos cada una de ellas <br>
                        <b>rápida, eficaz y simple.</b>
                    </h2>
                    <h2 class="font-size-2-5em line-height-50-px" style="color:#343a40">
                        <b>Solución Completa en Logística Integral</b>
                    </h2>
                </div>

                <div class="col bg-white" style="min-height: 525px; border-radius: 10px;">
                    <div class="mt-5 mb-4 center"><img src="../../../../assets/img/imagenCamion.png" alt="10px" style="width: 100%;  height: 190px;"></div>
                    <form [formGroup]="FormLogin"class="center" (ngSubmit)="Login()">
                        <div class="mb-1 col-12 ">
                            <mat-form-field appearance="outline" style=" min-width: 80%">
                                <mat-label>Email</mat-label>
                                <input type="email"  formControlName="email" [(ngModel)]="FormLogin.email" matInput placeholder="Ejempro@gmail.com">
                                
                            </mat-form-field>
                         </div>
                        <div class="mb-1 col-12">
                            <mat-form-field appearance="outline" style=" min-width: 80%">
                                <mat-label>Contraseña</mat-label>
                                <input type="password" minlength="5" formControlName="password" [(ngModel)]="FormLogin.password" matInput placeholder="Contraseña">
                                </mat-form-field>
                             
                        </div>
                        <div class="col-12 mb-4">
                            <button [disabled]="FormLogin.invalid" type="submit" mat-fab extended color="primary" style=" min-width: 80%">Ingresar</button>
                        </div>    
                        <div class="tm-5 mb-5"><a class="enlace" (click)="ModalContrasena()">¿Olvidaste tu contrseña?</a> </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
